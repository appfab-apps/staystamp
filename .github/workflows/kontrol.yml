name: kontrol

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kontrol-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kontrol:
    name: kontrol
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: HTML and internal links
        run: node scripts/check.mjs
